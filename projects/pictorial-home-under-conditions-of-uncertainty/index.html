<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pictorial // Home Under Conditions of Uncertainty — Madlen Wulffen</title>
    <meta name="description" content="Project case study: Pictorial // Home Under Conditions of Uncertainty" />

    <!-- Reuse your global site styles -->
    <link rel="stylesheet" href="../../stylesheets/style.css?v=3" />

    <style>
      :root{
        --rail: calc(1.5cm + clamp(16px,5vw,48px));
        --panel: min(36vw, 520px);
        --gap: clamp(12px, 2.2vw, 20px);
        --accent:#6A8BAE; /* placeholder accent (sky) */
      }

      /* 3-column layout */
      .case-layout{
        display:grid;
        grid-template-columns: var(--rail) var(--panel) 1fr;
        min-height:100vh;
      }
      .site-header{ position:sticky; top:0; z-index:50; }

      /* Left rail */
      .left-rail{
        position: sticky; top: 0; height: 100vh;
        display: flex; justify-content: center; align-items: flex-end;
        padding: 0 0 3cm 0; background: transparent;
      }
      .rail-text{
        margin: 0; font-weight: 900; text-transform: uppercase; letter-spacing: .06em;
        writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
        font-size: clamp(22px, 4.5vw, 60px);
      }

      /* Static panel (tile + meta) */
      .static-panel{
        position: sticky; top: 0; height: 100vh;
        display:flex; flex-direction:column; gap: var(--gap);
        padding: 6px 0 14px 0; background: transparent;
      }
      .hero-tile{
        width: calc(100% - 2cm); aspect-ratio: 1 / 1; background: var(--accent);
        display:grid; place-items:center; color:#111; padding: 20px; margin: 1cm;
      }
      .hero-tile .title{
        font-weight: 900; font-size: clamp(20px, 2.4vw, 32px);
        line-height: 1.1; letter-spacing: .03em; text-transform: uppercase;
        text-align: center;
      }
      .meta{
        margin-left: 1cm; max-width: calc(100% - 2cm);
        font-size: 16px; color: #111; display:grid; gap: 10px; text-align: left;
      }
      .meta dt{ font-weight: 600; margin: 0 0 2px 0; }
      .meta dd{ margin: 0 0 14px 0; min-height: 1.6em; }

      /* Scrollable content (right column) */
      .scroll-pane{ min-height:100vh; overflow:auto; padding: calc(6px + 1cm) 40px 40px 0; }
      .scroll-inner{ display:grid; gap: clamp(8px, 1.6vw, 18px); }

      .scroll-inner h2 { margin: 0 0 2px 0; font-weight: 800; }
      .scroll-inner p.intro { margin: 0 0 6px 0; }

      .reflection-text{
        margin: 0 0 10px 0; font-size: 10pt; font-weight: 300; color: #111; line-height: 1.5; white-space: pre-line;
      }

      /* =======================
         Article block (two columns)
         ======================= */
      .article-block {
        margin: 0 0 2.5rem 0;
        column-count: 2;
        column-gap: 2.4rem;
        column-fill: balance;
        text-align: justify;
        line-height: 1.6;
        font-size: 11pt;
        break-inside: avoid;
        padding-top: 0.2rem;
      }

      .article-block h1 {
        column-span: all;
        margin: 0 0 0.4rem 0;
        padding-bottom: 0.1rem;
        font-weight: 900;
        font-size: clamp(22px, 2.6vw, 32px);
        text-transform: uppercase;
        letter-spacing: .02em;
        text-align: left;
      }

      .article-subhead{
        column-span: all;
        margin: 0 0 0.6rem 0;
        font-size: 10pt;
        font-weight: 500;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .article-block p:first-of-type{
        margin-top: 0;
      }

      @media (max-width: 900px){
        .article-block{ column-count: 1; }
      }

      /* Optional media blocks if you want later */
      .reflection-image{
        margin: 0 0 1.8rem 0;
        display: flex;
        justify-content: center;
      }
      .reflection-image figure{
        margin: 0 auto;
        max-width: 80%;
        text-align: center;
      }
      .reflection-image img{
        display:block;
        max-width: 100%;
        height: auto;
      }
      .reflection-image figcaption{
        margin-top: 4px;
        font-size: 9pt;
        font-weight: 300;
        color:#444;
      }
    </style>
  </head>
