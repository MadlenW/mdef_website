<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Works (in progress) — Madlen Wulffen</title>
    <meta name="description" content="Projects by Madlen Wulffen." />

    <!-- Use the SAME stylesheet as home -->
    <link rel="stylesheet" href="../stylesheets/style.css?v=3" />

    <style>
      /* ===== Page-local styles for the Projects grid ===== */
      :root{
        --red-1:#D9043D;   /* keep */
        --navy:#273859;    /* keep */
        --citrus:#F2C14E;  /* warm yellow */
        --aqua:#06D6A0;    /* bright teal-green */
        --sky:#00A6FB;     /* vivid blue */
        --orange:#FF7F11;  /* bright orange */
        --grid-line:#dcdcdc;
      }

      /* Title row */
      .projects-hero{
        /* same horizontal padding as header for perfect edge alignment */
        padding: 6px clamp(16px,5vw,48px) 0;   /* tiny space under header border */
        border-bottom:1px solid var(--grid-line);
      }
      .projects-hero h1{
        margin:0;
        font-weight:900;
        text-transform:uppercase;
        letter-spacing:.04em;
        line-height:.92;
        font-size: clamp(32px, 12vw, 120px);
        text-align:right;                    /* align to right side of the site */
        transform: translateY(0);
      }

      /* Full-bleed grid (lines to page edges like reference) */
      .projects-grid{
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: minmax(240px, 36vw);
        margin: 0;
        border-top: 1px solid var(--grid-line);
        border-left: 1px solid var(--grid-line);
        background: transparent;
      }
      @media (max-width: 980px){
        .projects-grid{ grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 640px){
        .projects-grid{ grid-template-columns: 1fr; }
      }

      .cell{
        position: relative;
        overflow: hidden;
        border-right: 1px solid var(--grid-line);
        border-bottom: 1px solid var(--grid-line);
        cursor: pointer;
        isolation: isolate;
        background: transparent;
      }

      /* The PHOTO sits centered with a 2 cm frame around it (non-hover) */
      .img-frame{
        position: absolute; inset: 2cm;
        display: grid; place-items: center;
        z-index: 1;
      }
      @media (max-width: 640px){
        .img-frame{ inset: min(2cm, 24px); }
      }

      .img{
        width: 100%; height: 100%;
        background-size: cover; background-position: center;
        transition: transform .45s ease, opacity .2s ease;
      }

      /* Whole-cell color overlay on hover */
      .cell::after{
        content:""; position:absolute; inset:0; z-index: 2;
        background: var(--overlay, rgba(0,0,0,.7));
        opacity: 0; transition: opacity .2s ease;
      }
      .cell:hover::after{ opacity: 1; }
      .cell:hover .img{ transform: scale(1.03); }

      /* Title on hover */
      .label{
        position:absolute; inset:0; z-index: 3;
        display:grid; place-items:center; text-align:center;
        text-transform: uppercase; font-weight: 800; letter-spacing: .04em;
        font-size: clamp(16px, 2.2vw, 28px);
        padding: 20px; color: #fff; opacity: 0; transition: opacity .15s ease;
      }
      .cell:hover .label{ opacity: 1; }
      .cell[data-color="citrus"] .label,
      .cell[data-color="aqua"]   .label,
      .cell[data-color="sky"]    .label { color: #0e0e10; }

      /* Color mapping */
      .cell[data-color="red-1"] { --overlay: var(--red-1); }
      .cell[data-color="navy"]  { --overlay: var(--navy); }
      .cell[data-color="citrus"]{ --overlay: var(--citrus); }
      .cell[data-color="aqua"]  { --overlay: var(--aqua); }
      .cell[data-color="sky"]   { --overlay: var(--sky); }
      .cell[data-color="orange"]{ --overlay: var(--orange); }
    </style>
  </head>

  <body>
