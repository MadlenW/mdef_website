<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WORKS (IN PROGRESS)</title>

  <style>
    /* ===== Palette ===== */
    :root{
      --red-1:#D9043D;
      --red-2:#D90452;
      --navy:#273859;
      --sand:#D9C5AD;
      --oxblood:#591902;
      --ink:#0E0E10;
      --bg:#ffffff;
      --grid-line:#dcdcdc;
    }

    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif}
    a{color:inherit;text-decoration:none}

    /* ===== Header (circle left, nav right) ===== */
    .site-header{
      display:flex;align-items:center;justify-content:space-between;
      gap:16px;padding:16px clamp(16px,5vw,48px);
      border-bottom:1px solid var(--grid-line);
      position:sticky;top:0;background:var(--bg);z-index:50;
    }
    .brand{
      display:flex;align-items:center;gap:12px;
    }
    .brand .avatar{
      width:44px;height:44px;border-radius:999px;overflow:hidden;flex:0 0 auto;
      border:1px solid var(--grid-line);
      background:url("/assets/img/avatar.jpg") center/cover no-repeat; /* <-- update path */
    }
    .brand .name{font-weight:600;letter-spacing:.02em}
    nav.primary a{
      margin-left:24px; font-weight:500;
    }
    nav.primary a:hover{opacity:.7}

    /* ===== Hero title ===== */
    .hero{padding: clamp(16px,5vw,48px) clamp(16px,5vw,48px) 0}
    .hero-title{
      margin:0;border-bottom:1px solid var(--grid-line);
      padding-bottom: clamp(12px,1.5vw,16px);
      font-weight:900;text-transform:uppercase;letter-spacing:.04em;line-height:.92;
      font-size: clamp(32px, 12vw, 120px);   /* spans visually full width */
      word-break:break-word;
    }

    /* ===== Grid Frame (with visible lines) ===== */
    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: minmax(240px, 36vw);      /* responsive square-ish cells */
      border-top:1px solid var(--grid-line);
      border-left:1px solid var(--grid-line);
      margin:0 clamp(16px,5vw,48px) clamp(40px,6vw,80px);
    }
    .cell{
      position:relative;overflow:hidden;isolation:isolate;
      border-right:1px solid var(--grid-line);
      border-bottom:1px solid var(--grid-line);
      background:#f7f7f7;
      cursor:pointer;
    }

    /* Background image layer */
    .cell .img{
      position:absolute;inset:0;
      background-size:cover;background-position:center;
      transition: transform .5s ease, opacity .25s ease;
      z-index:1;
    }
    /* Color layer (entire tile color on hover) */
    .cell::after{
      content:"";position:absolute;inset:0;z-index:2;
      background: var(--overlay, rgba(0,0,0,.7));
      opacity:0;transition:opacity .25s ease;
    }
    .cell:hover::after{ opacity:1; }
    .cell:hover .img{ transform: scale(1.03); }

    /* Title shown on hover */
    .cell .label{
      position:absolute;inset:0;z-index:3;display:grid;place-items:center;
      text-transform:uppercase;font-weight:800;letter-spacing:.04em;text-align:center;
      opacity:0;transition:opacity .2s ease;
      padding:20px;
      color:#fff;
      font-size: clamp(16px, 2.2vw, 28px);
    }
    .cell[data-color="sand"] .label{ color:#111; } /* readable on light sand */

    .cell:hover .label{ opacity:1; }

    /* Color mapping (whole tile color via custom property) */
    .cell[data-color="red-1"]  { --overlay: var(--red-1); }
    .cell[data-color="red-2"]  { --overlay: var(--red-2); }
    .cell[data-color="navy"]   { --overlay: var(--navy); }
    .cell[data-color="sand"]   { --overlay: var(--sand); }
    .cell[data-color="oxblood"]{ --overlay: var(--oxblood); }
    .cell[data-color="navy-2"] { --overlay: var(--navy); }

    /* ===== Responsive columns ===== */
    @media (max-width: 980px){
      .grid{ grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px){
      .grid{ grid-template-columns: 1fr; }
      .hero-title{ font-size: clamp(32px, 16vw, 72px); } /* left-align naturally */
    }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="brand">
      <div class="avatar" aria-hidden="true"></div>
      <div class="name">Your Name</div>
    </div>
    <nav class="primary" aria-label="Primary">
      <a href="/projects/">Projects</a>
      <a href="/thinking-space/">Thinking Space</a>
      <a href="/about/">About</a>
    </nav>
  </header>

  <!-- ===== Title ===== -->
  <section class="hero" aria-labelledby="work-title">
    <h1 id="work-title" class="hero-title">WORKS (IN PROGRESS)</h1>
  </section>

  <!-- ===== Grid (3×2 with lines; full-cell color on hover) ===== -->
  <section class="grid" aria-label="Projects grid">
    <!-- Cell 1 -->
    <a class="cell" data-color="red-1" href="/projects/project-one/">
      <div class="img" style="background-image:url('https://picsum.photos/1200/900?random=31')"></div>
      <div class="label">Project One</div>
    </a>

    <!-- Cell 2 -->
    <a class="cell" data-color="red-2" href="/projects/project-two/">
      <div class="img" style="background-image:url('https://picsum.photos/1200/900?random=32')"></div>
      <div class="label">Project Two</div>
    </a>

    <!-- Cell 3 -->
    <a class="cell" data-color="navy" href="/projects/project-three/">
      <div class="img" style="background-image:url('https://picsum.photos/1200/900?random=33')"></div>
      <div class="label">Project Three</div>
    </a>

    <!-- Cell 4 -->
    <a class="cell" data-color="sand" href="/projects/project-four/">
      <div class="img" style="background-image:url('https://picsum.photos/1200/900?random=34')"></div>
      <div class="label">Project Four</div>
    </a>

    <!-- Cell 5 -->
    <a class="cell" data-color="oxblood" href="/projects/project-five/">
      <div class="img" style="background-image:url('https://picsum.photos/1200/900?random=35')"></div>
      <div class="label">Project Five</div>
    </a>

    <!-- Cell 6 -->
    <a class="cell" data-color="navy-2" href="/projects/project-six/">
      <div class="img" style="background-image:url('https://picsum.photos/1200/900?random=36')"></div>
      <div class="label">Project Six</div>
    </a>
  </section>

</body>
</html>
