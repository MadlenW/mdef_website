<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — Your Name</title>
  <meta name="description" content="Selected projects by Your Name." />
  <link rel="stylesheet" href="/stylesheets/style.css" />
</head>
<body>
  <!-- Header / Global Nav -->
  <header class="site-header">
    <a class="logo" href="/">Your Name</a>
    <nav class="site-nav">
      <a class="active" href="/projects/">Projects</a>
      <a href="/thinking-space/">Thinking Space</a>
      <a href="/about/">About</a>
    </nav>
  </header>

  <!-- Page Title + Filters -->
  <main class="wrap">
    <h1 class="page-title">Projects</h1>

    <div class="filters" aria-label="Project filters">
      <button data-filter="all" class="chip is-active">All</button>
      <button data-filter="urban-futures" class="chip">Urban Futures</button>
      <button data-filter="circular-design" class="chip">Circular Design</button>
      <button data-filter="research" class="chip">Research</button>
      <button data-filter="speculative" class="chip">Speculative</button>
    </div>

    <!-- Project Grid -->
    <section class="project-grid">
      <!-- CARD EXAMPLE — duplicate and change content/links -->
      <article class="project-card" data-tags="urban-futures research">
        <a class="project-link" href="/projects/project-name/">
          <figure class="project-thumb">
            <img src="/assets/images/projects/sample-1.jpg" alt="Project thumbnail" loading="lazy" />
          </figure>
          <div class="project-meta">
            <h2 class="project-title">Project Name</h2>
            <p class="project-tags">Urban Futures · Research · 2025</p>
            <p class="project-excerpt">One-line description of the concept and outcome.</p>
          </div>
        </a>
      </article>

      <article class="project-card" data-tags="circular-design">
        <a class="project-link" href="/projects/another-project/">
          <figure class="project-thumb">
            <img src="/assets/images/projects/sample-2.jpg" alt="Project thumbnail" loading="lazy" />
          </figure>
          <div class="project-meta">
            <h2 class="project-title">Another Project</h2>
            <p class="project-tags">Circular Design · 2024</p>
            <p class="project-excerpt">Short teaser sentence about the project.</p>
          </div>
        </a>
      </article>

      <!-- Add more cards here -->
    </section>
  </main>

  <script>
    // Tiny client-side filter (no framework)
    const chips = document.querySelectorAll('.chip');
    const cards = document.querySelectorAll('.project-card');
    chips.forEach(chip => chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('is-active'));
      chip.classList.add('is-active');
      const f = chip.dataset.filter;
      cards.forEach(card => {
        if (f === 'all' || card.dataset.tags.includes(f)) {
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      });
    }));
  </script>
</body>
</html>
